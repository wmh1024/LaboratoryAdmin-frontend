name: 功能建议
description: 提出新功能或改进建议
title: '[feat] '
labels: [enhancement]
body:
    - type: textarea
      id: problem
      attributes:
          label: 要解决的问题
          description: 描述当前痛点或使用场景，而不是直接给出实现方案。
      validations:
          required: true
    - type: textarea
      id: solution
      attributes:
          label: 建议方案
          description: 你希望如何解决？如有替代方案也请一并说明。
      validations:
          required: true
    - type: textarea
      id: scope
      attributes:
          label: 影响范围
          description: 是否涉及后端契约、Mock、现有页面或数据结构？
    - type: checkboxes
      id: checks
      attributes:
          label: 自查
          options:
              - label: 我已搜索过现有 Issue 与 Discussions
                required: true
