name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Node ${{ matrix.node-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: ['20.19.0', '22']
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Sensitive information scan
              run: npm run check:sensitive

            - name: Lint
              run: npm run lint

            - name: Format check
              run: npm run format:check

            - name: Unit tests + coverage baseline
              run: npm run test:coverage

            - name: Build (production, Mock excluded)
              run: npm run build

            - name: Assert no Mock data / facade bypass in production bundle
              run: npm run check:bundle

            - name: Build (demo, Mock included)
              run: npm run build:demo

            - name: Browser smoke (demo build)
              run: node scripts/smoke.mjs

            - name: Security audit (production dependencies)
              run: npm audit --omit=dev
